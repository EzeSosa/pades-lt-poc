[project]
name = "pades-lt-poc"
version = "0.1.0"
description = "PoC FastAPI + pyHanko: firma PAdES B-LT con TSA y mini PKI"
readme = "README.md"
authors = [
    { name = "Ezequiel Sosa", email = "ezequielsosa423@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.142.1",
    "pyhanko[opentype]>=0.37.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pades-lt-poc = "pades_lt_poc.app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # para reusar minimal_pdf() de scripts/demo.py
