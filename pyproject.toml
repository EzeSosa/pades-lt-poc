[project]
name = "pades-lt-poc"
version = "0.1.0"
description = "PoC FastAPI + pyHanko: firma PAdES B-LT con TSA y mini PKI"
readme = "README.md"
authors = [
    { name = "Ezequiel Sosa", email = "ezequielsosa423@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.142.1",
    "pyhanko[opentype]>=0.37.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pades-lt-poc = "pades_lt_poc.app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # para reusar minimal_pdf() de scripts/demo.py y el runner de la suite de PDFs
markers = ["suite: la suite de PDFs de prueba (testdata/pdf-suite); `-m \"not suite\"` la saltea"]

# Reglas de dependencias entre módulos (docs/adr/0001-arquitectura-hexagonal.md). Las corre
# tests/test_architecture.py; a mano: `uv run lint-imports`. Cada fase de la migración agrega
# las suyas a medida que aparecen las capas.
[tool.importlinter]
root_package = "pades_lt_poc"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "La lógica no depende de HTTP"
type = "forbidden"
source_modules = ["pades_lt_poc.services", "pades_lt_poc.pki"]
forbidden_modules = ["pades_lt_poc.app", "pades_lt_poc.dependencies", "pades_lt_poc.routers", "fastapi", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
name = "La mini PKI no depende de la lógica"
type = "forbidden"
source_modules = ["pades_lt_poc.pki"]
forbidden_modules = ["pades_lt_poc.services"]
