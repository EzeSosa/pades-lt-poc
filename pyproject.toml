[project]
name = "pades-lt-poc"
version = "0.1.0"
description = "PoC FastAPI + pyHanko: firma PAdES B-LT con TSA y mini PKI"
readme = "README.md"
authors = [
    { name = "Ezequiel Sosa", email = "ezequielsosa423@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.142.1",
    "pyhanko[opentype]>=0.37.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pades-lt-poc = "pades_lt_poc.app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]  # para reusar minimal_pdf() de scripts/demo.py y el runner de la suite de PDFs
markers = ["suite: la suite de PDFs de prueba (testdata/pdf-suite); `-m \"not suite\"` la saltea"]

# Reglas de dependencias entre capas (docs/arquitectura/README.md#reglas-de-dependencias). Las
# corre tests/test_architecture.py; a mano: `uv run lint-imports`.
[tool.importlinter]
root_package = "pades_lt_poc"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El dominio es Python puro"
type = "forbidden"
source_modules = ["pades_lt_poc.domain"]
forbidden_modules = [
    "pades_lt_poc.application", "pades_lt_poc.adapters", "pades_lt_poc.testbed",
    "pades_lt_poc.bootstrap", "pades_lt_poc.config", "pades_lt_poc.app",
    "pyhanko", "pyhanko_certvalidator", "asn1crypto", "cryptography", "fastapi", "starlette", "uvicorn",
    "requests", "aiohttp", "sqlite3",
]

[[tool.importlinter.contracts]]
name = "La aplicación depende sólo del dominio"
type = "forbidden"
source_modules = ["pades_lt_poc.application"]
forbidden_modules = [
    "pades_lt_poc.adapters", "pades_lt_poc.testbed",
    "pades_lt_poc.bootstrap", "pades_lt_poc.config", "pades_lt_poc.app",
    "pyhanko", "pyhanko_certvalidator", "asn1crypto", "cryptography", "fastapi", "starlette", "uvicorn",
    "requests", "aiohttp", "sqlite3",
]

[[tool.importlinter.contracts]]
name = "Los adaptadores de salida no conocen los de entrada, la composición ni el testbed"
type = "forbidden"
source_modules = ["pades_lt_poc.adapters.outbound"]
forbidden_modules = [
    "pades_lt_poc.adapters.inbound", "pades_lt_poc.testbed", "pades_lt_poc.bootstrap", "pades_lt_poc.config",
    "pades_lt_poc.app", "fastapi", "starlette", "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Los adaptadores de entrada conocen los casos de uso, no los de salida, la composición ni el testbed"
type = "forbidden"
source_modules = ["pades_lt_poc.adapters.inbound"]
forbidden_modules = [
    "pades_lt_poc.adapters.outbound", "pades_lt_poc.testbed", "pades_lt_poc.bootstrap", "pades_lt_poc.config",
    "pades_lt_poc.app",
]

[[tool.importlinter.contracts]]
name = "El testbed (el mundo externo simulado) no depende del núcleo"
type = "forbidden"
source_modules = ["pades_lt_poc.testbed"]
forbidden_modules = [
    "pades_lt_poc.domain", "pades_lt_poc.application", "pades_lt_poc.adapters",
    "pades_lt_poc.bootstrap", "pades_lt_poc.config", "pades_lt_poc.app",
]
