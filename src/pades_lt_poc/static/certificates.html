<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificados por firma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/static/ui.css">
<style>
  .card-error { margin: 0; padding: 18px 22px; color: var(--bad-fg); }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 16px 22px; border-top: 1px solid #F0F1F4; }
  li:first-child { border-top: 0; }
  .cert-info { display: flex; flex-direction: column; gap: 4px; flex: 999 1 420px; min-width: 0; }
  .cert-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .role { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 96px; }
  .cn { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .source { font: 12px var(--mono); padding: 1px 7px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; color: var(--muted); padding-left: 106px; }
  .actions { display: flex; gap: 8px; flex: 0 0 auto; flex-wrap: wrap; }
  .secondary.copied { background: var(--ok-bg); color: var(--ok-fg); border-color: #9CCFB0; }
  .copy { min-width: 158px; }
  details ol { border-top: 1px solid var(--line-soft); background: var(--surface); }
  @media (max-width: 640px) {
    .meta { padding-left: 0; }
    .role { width: auto; }
  }
</style>
</head>
<body>
<main>
  <nav aria-label="Herramientas">
    <a href="/ui/certificates" aria-current="page">Certificados</a>
    <a href="/ui/verify">Verificación</a>
    <a href="/docs" target="_blank" rel="noopener">API ↗</a>
  </nav>

  <header>
    <div class="eyebrow">POST /certificates</div>
    <h1>Certificados por firma</h1>
    <p class="lead">Subí un PDF firmado y obtené la cadena de certificados de cada firma criptográficamente válida, de la hoja a la raíz.</p>
  </header>

  <form id="form">
    <label class="field grow">
      <span>PDF firmado</span>
      <input type="file" name="pdf" accept="application/pdf" required>
    </label>
    <label class="check">
      <input type="checkbox" name="fetch_missing" checked>
      <span>Completar la cadena por AIA</span>
    </label>
    <button class="primary" type="submit">Extraer certificados</button>
  </form>

  <section id="result" hidden>
    <div class="summary">
      <h2 id="summary-title"></h2>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
  </section>
  <div id="cards" class="cards"></div>
</main>

<template id="cert-row">
  <li>
    <div class="cert-info">
      <div class="cert-title">
        <span class="role"></span>
        <span class="cn"></span>
        <span class="source" title="Origen del certificado"></span>
      </div>
      <div class="meta">
        <span class="issuer"></span>
        <span class="validity"></span>
        <span class="mono serial"></span>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="secondary download">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Descargar .crt
      </button>
      <button type="button" class="secondary copy">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span class="label">Copiar base64</span>
      </button>
    </div>
  </li>
</template>

<script>
const ROLES = { end_entity: "Firmante", intermediate: "Intermedia", root: "Raíz" };
const $ = (sel, root = document) => root.querySelector(sel);

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function cn(rfc4514) {
  // RFC 4514 con comas escapadas como "\,": se parte sólo en las comas sin escapar.
  const attr = rfc4514.split(/(?<!\\),/).find((part) => part.startsWith("CN="));
  return attr ? attr.slice(3).replace(/\\(.)/g, "$1") : rfc4514;
}

function date(iso) {
  return new Date(iso).toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "UTC" });
}

function filename(cert) {
  const base = cn(cert.subject).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w.-]+/g, "_");
  return `${base || cert.serial_number}.crt`;
}

function setStatus(text) {
  $("#status").textContent = text;
}

function download(cert) {
  const bytes = Uint8Array.from(atob(cert.der_b64), (c) => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/pkix-cert" }));
  const a = el("a");
  a.href = url;
  a.download = filename(cert);
  a.click();
  URL.revokeObjectURL(url);
  setStatus(`Descargado: ${a.download}`);
}

async function copy(cert, button) {
  try {
    await navigator.clipboard.writeText(cert.der_b64);
  } catch {
    // Contexto no seguro (p. ej. la app servida por IP sin HTTPS): fallback.
    const area = el("textarea");
    area.value = cert.der_b64;
    document.body.append(area);
    area.select();
    const ok = document.execCommand("copy");
    area.remove();
    if (!ok) return setStatus("No se pudo copiar al portapapeles");
  }
  document.querySelectorAll(".copy.copied").forEach((b) => {
    b.classList.remove("copied");
    $(".label", b).textContent = "Copiar base64";
  });
  button.classList.add("copied");
  $(".label", button).textContent = "Copiado";
  setStatus(`Base64 de ${cn(cert.subject)} copiado al portapapeles`);
}

function certList(certs) {
  const list = el("ol");
  for (const cert of certs) {
    const row = $("#cert-row").content.firstElementChild.cloneNode(true);
    $(".role", row).textContent = ROLES[cert.type];
    $(".cn", row).textContent = cn(cert.subject);
    $(".source", row).textContent = cert.source;
    $(".issuer", row).textContent = `Emisor: ${cn(cert.issuer)}${cert.self_signed ? " (autofirmado)" : ""}`;
    $(".validity", row).textContent = `Vigencia: ${date(cert.not_before)} – ${date(cert.not_after)}`;
    $(".serial", row).textContent = `Serie ${cert.serial_number}`;
    $(".download", row).setAttribute("aria-label", `Descargar ${cn(cert.subject)}.crt`);
    $(".download", row).addEventListener("click", () => download(cert));
    const copyButton = $(".copy", row);
    copyButton.setAttribute("aria-label", `Copiar base64 de ${cn(cert.subject)}`);
    copyButton.addEventListener("click", () => copy(cert, copyButton));
    list.append(row);
  }
  return list;
}

function chainBadge(entry) {
  if (!entry.chain_complete) return el("span", "badge warn", "Cadena incompleta");
  if (entry.certificates.some((c) => c.source === "aia")) return el("span", "badge warn", "Completada por AIA");
  return el("span", "badge ok", "Cadena completa");
}

function chainNotes(entry) {
  return (entry.aia_errors || []).map((msg) => el("p", "note", `AIA: ${msg}`));
}

function card(entry) {
  const article = el("article");
  const head = el("div", "card-head");
  head.append(
    el("h3", null, entry.field),
    el("span", "chip", entry.type === "DocTimeStamp" ? "Sello de documento" : "Firma"),
    el("span", "spacer"),
  );
  article.append(head);

  if (!entry.crypto_valid) {
    head.append(el("span", "badge bad", "Firma inválida"));
    article.append(el("p", "card-error", `${entry.error} — no se extraen certificados.`));
    return article;
  }
  head.append(el("span", "badge ok", "Firma válida"), chainBadge(entry));
  article.append(certList(entry.certificates), ...chainNotes(entry));

  const ts = entry.signature_timestamp;
  if (ts) {
    const details = el("details");
    const summary = el("summary");
    summary.append(el("strong", null, "Sello de tiempo"));
    if (ts.crypto_valid) {
      summary.append(
        el("span", "mono", new Date(ts.time).toISOString().replace("T", " ").replace(/\.\d+Z$|Z$/, " UTC")),
        el("span", null, `· ${cn(ts.certificates[0].subject)}`),
        el("span", "toggle", `Cadena de la TSA (${ts.certificates.length})`),
      );
      details.append(summary, certList(ts.certificates), ...chainNotes(ts));
    } else {
      summary.append(el("span", "badge bad", `Inválido: ${ts.error}`));
      details.append(summary);
    }
    article.append(details);
  }
  return article;
}

$("#form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = event.currentTarget;
  const file = form.pdf.files[0];
  const body = new FormData();
  body.append("pdf", file);
  body.append("fetch_missing", form.fetch_missing.checked);

  const button = $("button[type=submit]", form);
  button.disabled = true;
  button.textContent = "Extrayendo…";
  const cards = $("#cards");
  cards.replaceChildren();
  $("#result").hidden = true;
  try {
    const response = await fetch("/certificates", { method: "POST", body });
    const data = await response.json();
    if (!response.ok) {
      const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
      throw new Error(detail || `HTTP ${response.status}`);
    }
    const n = data.signatures.length;
    $("#summary-title").textContent = `${file.name} · ${n} ${n === 1 ? "firma" : "firmas"}`;
    setStatus("");
    $("#result").hidden = false;
    cards.append(...data.signatures.map(card));
  } catch (error) {
    cards.append(el("div", "error-box", `No se pudo procesar el PDF: ${error.message}`));
  } finally {
    button.disabled = false;
    button.textContent = "Extraer certificados";
  }
});
</script>
</body>
</html>
